name: Build Installers (macOS DMG + Windows EXE)

# ── How to enable full macOS code-signing + notarization ──────────────────
#
# Without an Apple Developer certificate the DMG is unsigned. macOS Gatekeeper
# will warn or block it. To sign and notarize, add these GitHub repository
# secrets (Settings → Secrets → Actions):
#
#   CSC_LINK            Base64-encoded .p12 certificate exported from Keychain
#                       $ base64 -i certificate.p12 | pbcopy
#   CSC_KEY_PASSWORD    Password you set when exporting the .p12
#   APPLE_ID            Your Apple ID email  (e.g. dev@example.com)
#   APPLE_ID_PASSWORD   App-specific password from appleid.apple.com
#   APPLE_TEAM_ID       10-character Team ID from developer.apple.com/account
#
# When those secrets are present the build will be signed with your certificate
# and submitted to Apple for notarization automatically.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "photo-sort-pro/**"
      - ".github/workflows/build-dmg.yml"
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: photo-sort-pro/package-lock.json

      - name: Install dependencies
        working-directory: photo-sort-pro
        run: npm ci

      - name: Build renderer + main
        working-directory: photo-sort-pro
        run: npm run build

      # ── Signed + notarized build (requires Apple Developer secrets) ───────
      - name: Package → DMG (signed + notarized)
        if: ${{ secrets.CSC_LINK != '' }}
        working-directory: photo-sort-pro
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ── Ad-hoc signed build (no secrets — passes more Gatekeeper checks
      #    than a fully unsigned binary, but still requires xattr bypass) ───
      - name: Package → DMG (ad-hoc signed)
        if: ${{ secrets.CSC_LINK == '' }}
        working-directory: photo-sort-pro
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Apply a deep ad-hoc codesign to every binary inside the .app bundle.
      # This prevents "damaged app" errors but does NOT bypass Gatekeeper for
      # quarantined downloads — users still need the xattr command below.
      - name: Ad-hoc deep codesign app bundle
        if: ${{ secrets.CSC_LINK == '' }}
        working-directory: photo-sort-pro
        run: |
          APP=$(ls -d release/mac*/*.app 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Signing: $APP"
            codesign --deep --force --sign - "$APP"
          fi

      - name: List release artifacts
        working-directory: photo-sort-pro
        run: ls -lh release/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSortPro-macOS-DMG
          path: photo-sort-pro/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-win:
    name: Windows EXE installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: photo-sort-pro/package-lock.json

      - name: Install dependencies
        working-directory: photo-sort-pro
        run: npm ci

      - name: Build renderer + main
        working-directory: photo-sort-pro
        run: npm run build

      - name: Package → EXE
        working-directory: photo-sort-pro
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSortPro-Windows-Setup
          path: |
            photo-sort-pro/release/*.exe
          if-no-files-found: error
          retention-days: 30
